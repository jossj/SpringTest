<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Earth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            color: #e2e8f0;
            user-select: none;
        }

        #globe-canvas {
            display: block;
            cursor: grab;
        }
        #globe-canvas.dragging { cursor: grabbing; }

        /* ── Loading screen ─────────────────────────────────────── */
        #loading {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            z-index: 200;
            transition: opacity .6s ease;
        }
        #loading.fade-out { opacity: 0; pointer-events: none; }

        .loading-ring {
            width: 52px; height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(59,130,246,.15);
            border-top-color: #3b82f6;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-label {
            font-size: .8rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #334155;
        }

        /* ── HUD ─────────────────────────────────────────────────── */
        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* Top bar gradient */
        .hud-top {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 1.25rem 1.75rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(to bottom, rgba(0,0,0,.65) 0%, transparent 100%);
        }

        /* Live indicator + title */
        .hud-brand { display: flex; align-items: center; gap: .75rem; }
        .live-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            flex-shrink: 0;
            animation: pulse-dot 2.4s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1;  box-shadow: 0 0 0 0   rgba(34,197,94,.5); }
            50%       { opacity: .7; box-shadow: 0 0 0 7px rgba(34,197,94,0);  }
        }
        .hud-title    { font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
        .hud-subtitle { font-size: .68rem; color: #475569; letter-spacing: .06em; text-transform: uppercase; margin-top: .15rem; }

        /* Clock */
        .hud-clock-wrap { text-align: right; }
        .hud-clock {
            font-size: 1.55rem;
            font-weight: 300;
            letter-spacing: .03em;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .hud-utc { font-size: .65rem; color: #475569; letter-spacing: .06em; text-transform: uppercase; margin-top: .2rem; }

        /* Nav buttons */
        .hud-nav { display: flex; align-items: center; gap: .6rem; margin-bottom: .75rem; }
        .hud-btn {
            pointer-events: all;
            display: inline-flex; align-items: center; gap: .35rem;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 8px;
            color: #94a3b8;
            font-size: .78rem;
            font-family: 'Inter', sans-serif;
            padding: .4rem .85rem;
            cursor: pointer;
            transition: background .15s, color .15s;
            text-decoration: none;
        }
        .hud-btn:hover { background: rgba(255,255,255,.12); color: #e2e8f0; }

        /* Top-right cluster */
        .hud-top-right { display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; }

        /* Bottom bar */
        .hud-bottom {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 1rem 1.75rem 1.4rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: linear-gradient(to top, rgba(0,0,0,.65) 0%, transparent 100%);
        }

        .data-pill {
            display: inline-flex; align-items: center; gap: .5rem;
            background: rgba(0,0,0,.45);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px;
            padding: .32rem .9rem;
            font-size: .7rem;
            color: #64748b;
        }
        .data-pill .pill-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #3b82f6;
            flex-shrink: 0;
        }

        .hud-hint { font-size: .68rem; color: #1e2d40; }
    </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading">
    <div class="loading-ring"></div>
    <div class="loading-label" id="loadingMsg">Initialising…</div>
</div>

<!-- Canvas -->
<canvas id="globe-canvas"></canvas>

<!-- HUD overlay -->
<div id="hud">
    <div class="hud-top">
        <div class="hud-brand">
            <div class="live-dot"></div>
            <div>
                <div class="hud-title">Live Earth</div>
                <div class="hud-subtitle" id="dataLabel">Connecting…</div>
            </div>
        </div>

        <div class="hud-top-right">
            <div class="hud-nav">
                <a th:href="@{/dashboard}" href="/dashboard" class="hud-btn">
                    <i class="bi bi-arrow-left"></i> Dashboard
                </a>
            </div>
            <div class="hud-clock-wrap">
                <div class="hud-clock" id="clock">--:--:--</div>
                <div class="hud-utc" id="utcDate">UTC</div>
            </div>
        </div>
    </div>

    <div class="hud-bottom">
        <div class="data-pill">
            <div class="pill-dot"></div>
            <span id="dataInfo">VIIRS NOAA-20 · True Color · Daily mosaic</span>
        </div>
        <div class="hud-hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
    'use strict';

    // ── Texture base URLs ────────────────────────────────────────
    const GH = 'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/textures/planets/';
    const STATIC_EARTH  = GH + 'earth_atmos_2048.jpg';
    const STATIC_SPEC   = GH + 'earth_specular_2048.jpg';
    const STATIC_NORMAL = GH + 'earth_normal_2048.jpg';
    const STATIC_CLOUDS = GH + 'earth_clouds_1024.png';

    function gibsUrl(date) {
        return (
            'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi' +
            '?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0' +
            '&LAYERS=VIIRS_NOAA20_CorrectedReflectance_TrueColor' +
            '&STYLES=&CRS=EPSG:4326&BBOX=-90,-180,90,180' +
            '&WIDTH=2048&HEIGHT=1024&FORMAT=image/jpeg' +
            '&TIME=' + date
        );
    }

    function isoDate(daysBack) {
        const d = new Date(Date.now() - daysBack * 86400000);
        return d.toISOString().slice(0, 10);
    }

    // ── Renderer ─────────────────────────────────────────────────
    const canvas = document.getElementById('globe-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    // ── Scene & Camera ───────────────────────────────────────────
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 2.7;

    // ── Lighting ─────────────────────────────────────────────────
    const sun = new THREE.DirectionalLight(0xfff5e8, 2.0);
    sun.position.set(5, 2, 4);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x11172a, 1.5));
    const fillLight = new THREE.DirectionalLight(0x1a3060, 0.25);
    fillLight.position.set(-5, -2, -4);
    scene.add(fillLight);

    // ── Star field ───────────────────────────────────────────────
    (function buildStars() {
        const N = 14000;
        const pos   = new Float32Array(N * 3);
        const sizes = new Float32Array(N);
        for (let i = 0; i < N; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi   = Math.acos(2 * Math.random() - 1);
            const r     = 450 + Math.random() * 150;
            pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            pos[i * 3 + 2] = r * Math.cos(phi);
            sizes[i] = Math.random() > 0.96 ? 2.4 + Math.random() : Math.random() * 1.1 + 0.2;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));
        const mat = new THREE.ShaderMaterial({
            vertexShader: `
                attribute float aSize;
                varying float vAlpha;
                void main() {
                    vAlpha = clamp(aSize / 2.4, 0.3, 1.0);
                    vec4 mv = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = aSize * (280.0 / -mv.z);
                    gl_Position  = projectionMatrix * mv;
                }`,
            fragmentShader: `
                varying float vAlpha;
                void main() {
                    float d = length(gl_PointCoord - 0.5) * 2.0;
                    float a = smoothstep(1.0, 0.0, d) * vAlpha;
                    gl_FragColor = vec4(1.0, 0.98, 0.95, a);
                }`,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        scene.add(new THREE.Points(geo, mat));
    })();

    // ── Globe group (earth + cloud layer, interactive) ───────────
    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    // Earth sphere
    const earthMat = new THREE.MeshPhongMaterial({
        color: 0x1a3d6b,
        specular: new THREE.Color(0x334466),
        shininess: 20,
    });
    const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), earthMat);
    globeGroup.add(earth);

    // Cloud layer (slightly above Earth)
    const cloudMat = new THREE.MeshPhongMaterial({
        transparent: true,
        opacity: 0,
        depthWrite: false,
        blending: THREE.NormalBlending,
    });
    const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.012, 64, 64), cloudMat);
    globeGroup.add(clouds);

    // ── Atmosphere glow (Fresnel — outside the globe group) ──────
    const fresnelVert = `
        varying vec3 vNormal;
        varying vec3 vViewDir;
        void main() {
            vNormal  = normalize(normalMatrix * normal);
            vec4 mv  = modelViewMatrix * vec4(position, 1.0);
            vViewDir = normalize(-mv.xyz);
            gl_Position = projectionMatrix * mv;
        }`;

    function makeAtmo(radius, coeff, power, r, g, b) {
        return new THREE.Mesh(
            new THREE.SphereGeometry(radius, 64, 64),
            new THREE.ShaderMaterial({
                uniforms: {
                    coeff: { value: coeff },
                    power: { value: power },
                    glowColor: { value: new THREE.Color(r, g, b) },
                },
                vertexShader: fresnelVert,
                fragmentShader: `
                    uniform float coeff;
                    uniform float power;
                    uniform vec3  glowColor;
                    varying vec3 vNormal;
                    varying vec3 vViewDir;
                    void main() {
                        float i = pow(coeff - dot(vNormal, vViewDir), power);
                        gl_FragColor = vec4(glowColor, i);
                    }`,
                blending:    THREE.AdditiveBlending,
                side:        THREE.FrontSide,
                transparent: true,
                depthWrite:  false,
            })
        );
    }

    const outerAtmo = makeAtmo(1.085, 0.62, 4.5, 0.22, 0.52, 1.0);
    const innerAtmo = makeAtmo(1.040, 0.48, 7.0, 0.12, 0.38, 0.9);
    scene.add(outerAtmo);
    scene.add(innerAtmo);

    // ── Texture loader ────────────────────────────────────────────
    const loader = new THREE.TextureLoader();
    loader.crossOrigin = 'anonymous';

    function loadTex(url) {
        return new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
    }

    async function initTextures() {
        const msgEl    = document.getElementById('loadingMsg');
        const labelEl  = document.getElementById('dataLabel');
        const infoEl   = document.getElementById('dataInfo');

        // Static support textures first (load in parallel)
        msgEl.textContent = 'Loading base textures…';
        const [specTex, normTex, cloudTex] = await Promise.all([
            loadTex(STATIC_SPEC).catch(() => null),
            loadTex(STATIC_NORMAL).catch(() => null),
            loadTex(STATIC_CLOUDS).catch(() => null),
        ]);

        if (cloudTex) {
            cloudMat.map     = cloudTex;
            cloudMat.opacity = 0.82;
            cloudMat.needsUpdate = true;
        }

        // Try NASA GIBS real-time satellite data (today → yesterday → 2 days ago)
        msgEl.textContent = 'Fetching live satellite data…';
        let earthTex  = null;
        let usedDate  = null;

        for (let back = 0; back <= 2; back++) {
            const d = isoDate(back);
            try {
                earthTex = await loadTex(gibsUrl(d));
                usedDate = d;
                break;
            } catch (_) {
                console.info(`VIIRS unavailable for ${d}, trying previous day`);
            }
        }

        if (earthTex) {
            labelEl.textContent = 'Live satellite · ' + usedDate;
            infoEl.textContent  = 'VIIRS NOAA-20 · True Color · ' + usedDate;
        } else {
            // Fallback to static Blue Marble
            msgEl.textContent = 'Loading fallback imagery…';
            earthTex = await loadTex(STATIC_EARTH).catch(() => null);
            labelEl.textContent = 'Static imagery · Blue Marble';
            infoEl.textContent  = 'NASA Blue Marble · Static fallback active';
        }

        if (earthTex) {
            earthMat.map   = earthTex;
            earthMat.color.setHex(0xffffff);
        }
        if (specTex) {
            earthMat.specularMap = specTex;
            earthMat.specular.set(0x446688);
        }
        if (normTex) {
            earthMat.normalMap   = normTex;
            earthMat.normalScale.set(0.8, 0.8);
        }
        earthMat.needsUpdate = true;

        // Dismiss loading screen
        msgEl.textContent = 'Ready';
        setTimeout(() => {
            const el = document.getElementById('loading');
            el.classList.add('fade-out');
            setTimeout(() => el.remove(), 650);
        }, 200);
    }

    initTextures();

    // Schedule cloud refresh every 30 minutes
    setInterval(async () => {
        const infoEl = document.getElementById('dataInfo');
        if (!infoEl) return;
        for (let back = 0; back <= 2; back++) {
            const d = isoDate(back);
            try {
                const tex = await loadTex(gibsUrl(d) + '&_=' + Date.now());
                earthMat.map = tex;
                earthMat.needsUpdate = true;
                document.getElementById('dataLabel').textContent = 'Live satellite · ' + d;
                infoEl.textContent = 'VIIRS NOAA-20 · True Color · ' + d + ' (refreshed)';
                break;
            } catch (_) { /* try next day */ }
        }
    }, 30 * 60 * 1000);

    // ── Clock ─────────────────────────────────────────────────────
    const clockEl   = document.getElementById('clock');
    const utcDateEl = document.getElementById('utcDate');
    function tickClock() {
        const n = new Date();
        clockEl.textContent   = [n.getUTCHours(), n.getUTCMinutes(), n.getUTCSeconds()]
            .map(v => String(v).padStart(2, '0')).join(':');
        utcDateEl.textContent = n.toUTCString().slice(0, 16) + ' UTC';
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ── Interaction ───────────────────────────────────────────────
    let dragging    = false;
    let autoRotate  = true;
    let resumeTimer = null;
    let prev        = { x: 0, y: 0 };
    let vel         = { x: 0, y: 0 };

    function clientXY(e) {
        return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
                         : { x: e.clientX,            y: e.clientY };
    }

    canvas.addEventListener('mousedown',  startDrag);
    canvas.addEventListener('touchstart', startDrag, { passive: true });
    window.addEventListener('mousemove',  moveDrag);
    window.addEventListener('touchmove',  e => { e.preventDefault(); moveDrag(e); }, { passive: false });
    window.addEventListener('mouseup',    endDrag);
    window.addEventListener('touchend',   endDrag);
    canvas.addEventListener('wheel',      onWheel, { passive: true });

    function startDrag(e) {
        dragging   = true;
        autoRotate = false;
        canvas.classList.add('dragging');
        vel  = { x: 0, y: 0 };
        prev = clientXY(e);
        clearTimeout(resumeTimer);
    }
    function moveDrag(e) {
        if (!dragging) return;
        const c   = clientXY(e);
        vel.y = (c.x - prev.x) * 0.005;
        vel.x = (c.y - prev.y) * 0.005;
        globeGroup.rotation.y += vel.y;
        globeGroup.rotation.x  = Math.max(-1.3, Math.min(1.3, globeGroup.rotation.x + vel.x));
        prev = c;
    }
    function endDrag() {
        dragging = false;
        canvas.classList.remove('dragging');
        resumeTimer = setTimeout(() => { autoRotate = true; }, 2200);
    }
    function onWheel(e) {
        camera.position.z = Math.max(1.5, Math.min(5.5, camera.position.z + e.deltaY * 0.005));
    }

    // ── Resize ────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ── Render loop ───────────────────────────────────────────────
    const clock3 = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const t = clock3.getElapsedTime();

        if (autoRotate) {
            globeGroup.rotation.y += 0.00075;
        } else if (!dragging) {
            vel.x *= 0.94;
            vel.y *= 0.94;
            globeGroup.rotation.y += vel.y;
            globeGroup.rotation.x  = Math.max(-1.3, Math.min(1.3, globeGroup.rotation.x + vel.x));
        }

        // Clouds drift slightly faster than the Earth
        clouds.rotation.y += 0.00018;

        // Subtle atmosphere breathe
        outerAtmo.material.uniforms.coeff.value = 0.62 + Math.sin(t * 0.4) * 0.018;

        renderer.render(scene, camera);
    }
    animate();

})();
</script>
</body>
</html>
