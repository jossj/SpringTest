<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
        body { background: #f0f2f5; }
        .navbar { background: #1a1a2e; }
        .stat-card { border: none; border-radius: 12px; }
        .stat-card .icon { font-size: 2rem; opacity: .8; }
        .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; }
        .badge-admin { background: #6f42c1; }
        .badge-user  { background: #0d6efd; }
        .card { border: none; border-radius: 12px; }
        .rank-medal { font-size: 1.1rem; }
        .leaderboard-bar { height: 6px; border-radius: 3px; background: #e9ecef; }
        .leaderboard-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #f6c90e, #ff9500); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3 mb-4">
    <span class="navbar-brand fw-bold"><i class="bi bi-speedometer2 me-2"></i>Admin Dashboard</span>
    <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
    </form>
</nav>

<div class="container-fluid px-4">

    <!-- Stat cards -->
    <div class="row g-3 mb-4">
        <div class="col-sm-4">
            <div class="card stat-card shadow-sm p-3 d-flex flex-row align-items-center gap-3">
                <div class="icon text-primary"><i class="bi bi-people-fill"></i></div>
                <div>
                    <div class="fs-4 fw-bold" th:text="${userCount}">0</div>
                    <div class="text-muted small">Total Users</div>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="card stat-card shadow-sm p-3 d-flex flex-row align-items-center gap-3">
                <div class="icon text-success"><i class="bi bi-trophy-fill"></i></div>
                <div>
                    <div class="fs-4 fw-bold" th:text="${rewardCount}">0</div>
                    <div class="text-muted small">Total Rewards</div>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="card stat-card shadow-sm p-3 d-flex flex-row align-items-center gap-3">
                <div class="icon text-warning"><i class="bi bi-star-fill"></i></div>
                <div>
                    <div class="fs-4 fw-bold" th:text="${totalPoints}">0</div>
                    <div class="text-muted small">Points Awarded</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaderboard card -->
    <div class="row g-3 mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3 d-flex align-items-center gap-2">
                    <i class="bi bi-bar-chart-fill text-warning fs-5"></i>
                    <h6 class="mb-0 fw-semibold">Points Leaderboard</h6>
                </div>
                <div class="card-body">
                    <div th:if="${#maps.isEmpty(leaderboard)}" class="text-center text-muted py-2">No data yet</div>
                    <div class="row g-3" th:if="${not #maps.isEmpty(leaderboard)}">
                        <div class="col-md-4 col-sm-6"
                             th:each="entry, iter : ${leaderboard}">
                            <div class="d-flex align-items-center gap-3">
                                <span class="rank-medal fw-bold text-muted" style="min-width:1.5rem; text-align:right">
                                    <span th:if="${iter.index == 0}">🥇</span>
                                    <span th:if="${iter.index == 1}">🥈</span>
                                    <span th:if="${iter.index == 2}">🥉</span>
                                    <span th:if="${iter.index > 2}" th:text="${iter.index + 1} + '.'"></span>
                                </span>
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between mb-1">
                                        <span class="fw-semibold small" th:text="${entry.key}"></span>
                                        <span class="small text-muted" th:text="${entry.value} + ' pts'"></span>
                                    </div>
                                    <div class="leaderboard-bar">
                                        <div class="leaderboard-bar-fill"
                                             th:style="'width:' + (${totalPoints} > 0 ? (${entry.value} * 100 / ${totalPoints}) : 0) + '%'"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">

        <!-- Rewards tile -->
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h6 class="mb-0 fw-semibold"><i class="bi bi-trophy me-2 text-success"></i>Rewards by Behavior</h6>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">User</th>
                                <th th:each="type : ${rewardTypes}" th:text="${type}"></th>
                                <th class="fw-bold">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${rewardRows}">
                                <td class="ps-3 fw-semibold" th:text="${row.username}"></td>
                                <td th:each="pts : ${row.typePoints}">
                                    <span th:if="${pts != null}" class="badge bg-warning text-dark" th:text="${pts}"></span>
                                    <span th:if="${pts == null}" class="text-muted">—</span>
                                </td>
                                <td>
                                    <span class="badge bg-success" th:text="${row.total} + ' pts'"></span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(rewardRows)}">
                                <td th:colspan="${#lists.size(rewardTypes) + 2}" class="text-center text-muted py-3">No rewards found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Users table -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white py-3">
                    <h6 class="mb-0 fw-semibold"><i class="bi bi-people me-2 text-primary"></i>Users</h6>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td class="ps-3 text-muted" th:text="${user.id}"></td>
                                <td th:text="${user.username}"></td>
                                <td class="text-muted" th:text="${user.email}"></td>
                                <td>
                                    <span th:if="${user.role == 'ADMIN'}" class="badge badge-admin">ADMIN</span>
                                    <span th:if="${user.role != 'ADMIN'}" class="badge badge-user">USER</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="4" class="text-center text-muted py-3">No users found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- User Rewards Breakdown -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white py-3">
                    <h6 class="mb-0 fw-semibold"><i class="bi bi-pie-chart-fill me-2 text-info"></i>User Rewards Breakdown</h6>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="chartUserSelect" class="form-label fw-semibold">Select User</label>
                            <select id="chartUserSelect" class="form-select">
                                <option value="" disabled selected>Choose a user…</option>
                                <option th:each="u : ${users}" th:value="${u.username}" th:text="${u.username}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="row justify-content-center">
                        <div id="chartNoData" class="col-12 text-center text-muted py-4">
                            <i class="bi bi-pie-chart fs-1 opacity-25"></i>
                            <div class="mt-2 small">Select a user to see their rewards breakdown.</div>
                        </div>
                        <div id="chartWrapper" class="col-10 d-none">
                            <canvas id="rewardPieChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Add User Rewards -->
    <div class="row g-4 mt-2 mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h6 class="mb-0 fw-semibold"><i class="bi bi-plus-circle me-2 text-success"></i>Add User Reward</h6>
                </div>
                <div class="card-body">
                    <div id="reward-alert" class="alert d-none" role="alert"></div>
                    <form id="add-reward-form" class="row g-3 align-items-end">
                        <div class="col-md-2">
                            <label for="rewardUser" class="form-label fw-semibold">User</label>
                            <select id="rewardUser" class="form-select" required>
                                <option value="" disabled selected>Select a user…</option>
                                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="rewardBehavior" class="form-label fw-semibold">Behavior</label>
                            <select id="rewardBehavior" class="form-select" required>
                                <option value="" disabled selected>Select a behavior…</option>
                                <option th:each="type : ${rewardTypes}" th:value="${type}" th:text="${type}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="rewardDescription" class="form-label fw-semibold">Description</label>
                            <input type="text" id="rewardDescription" class="form-control" placeholder="Optional description">
                        </div>
                        <div class="col-md-1">
                            <label for="rewardPoints" class="form-label fw-semibold">Points</label>
                            <input type="number" id="rewardPoints" class="form-control" min="1" value="10" required>
                        </div>
                        <div class="col-md-2">
                            <label for="rewardTitle" class="form-label fw-semibold">Title</label>
                            <input type="text" id="rewardTitle" class="form-control" placeholder="e.g. Great job!" required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-check-circle me-1"></i>Submit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<script th:inline="javascript">
    (function () {
        const rewardTypes = /*[[${rewardTypes}]]*/ [];
        const rewardRows  = /*[[${rewardRows}]]*/ [];

        const SLICE_COLORS = ['#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b', '#fd7e14'];

        const byUser = {};
        rewardRows.forEach(function (row) {
            byUser[row.username] = (row.typePoints || []).map(function (v) { return v == null ? 0 : v; });
        });

        let chart = null;

        document.getElementById('chartUserSelect').addEventListener('change', function () {
            const username = this.value;
            const pts = byUser[username] || new Array(rewardTypes.length).fill(0);

            const labels = [], data = [], colors = [];
            rewardTypes.forEach(function (type, i) {
                if (pts[i] > 0) {
                    labels.push(type);
                    data.push(pts[i]);
                    colors.push(SLICE_COLORS[i % SLICE_COLORS.length]);
                }
            });

            const noData   = document.getElementById('chartNoData');
            const wrapper  = document.getElementById('chartWrapper');
            const canvas   = document.getElementById('rewardPieChart');

            if (data.length === 0) {
                noData.classList.remove('d-none');
                wrapper.classList.add('d-none');
                if (chart) { chart.destroy(); chart = null; }
                noData.innerHTML = '<i class="bi bi-pie-chart fs-1 opacity-25"></i><div class="mt-2 small">No rewards recorded for this user yet.</div>';
                return;
            }

            noData.classList.add('d-none');
            wrapper.classList.remove('d-none');

            if (chart) chart.destroy();

            const total = data.reduce(function (a, b) { return a + b; }, 0);

            chart = new Chart(canvas, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderColor: '#fff',
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { padding: 20, font: { size: 13 } }
                        },
                        tooltip: {
                            callbacks: {
                                label: function (ctx) {
                                    const pct = Math.round(ctx.parsed / total * 100);
                                    return '  ' + ctx.label + ': ' + ctx.parsed + ' pts (' + pct + '%)';
                                }
                            }
                        }
                    }
                }
            });
        });
    })();
</script>

<script>
    document.getElementById('add-reward-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const userId = document.getElementById('rewardUser').value;
        const type = document.getElementById('rewardBehavior').value;
        const points = parseInt(document.getElementById('rewardPoints').value, 10);
        const title = document.getElementById('rewardTitle').value.trim();
        const description = document.getElementById('rewardDescription').value.trim();
        const alertEl = document.getElementById('reward-alert');

        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        try {
            const response = await fetch('/api/rewards', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify({
                    title: title,
                    description: description,
                    points: points,
                    type: type,
                    user: { id: parseInt(userId, 10) }
                })
            });

            if (response.ok) {
                alertEl.className = 'alert alert-success';
                alertEl.textContent = 'Reward added successfully!';
                alertEl.classList.remove('d-none');
                document.getElementById('add-reward-form').reset();
                setTimeout(() => { alertEl.classList.add('d-none'); location.reload(); }, 1500);
            } else {
                const err = await response.text();
                alertEl.className = 'alert alert-danger';
                alertEl.textContent = 'Error: ' + (err || response.statusText);
                alertEl.classList.remove('d-none');
            }
        } catch (err) {
            alertEl.className = 'alert alert-danger';
            alertEl.textContent = 'Network error: ' + err.message;
            alertEl.classList.remove('d-none');
        }
    });
</script>

</body>
</html>
