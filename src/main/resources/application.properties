spring.application.name=spring-test
server.port=8080

# Security (default user for testing - change in production!)
spring.security.user.name=admin
spring.security.user.password=admin123

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/springtest?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
